name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests: counter, form rules, hints, features, and the hand-labelled corpus gate (tests/corpus.test.ts,
      # the Python, browser-recorded and browser-recorded-mirrored landmark traces; a miss fails unless listed as known).
      - run: npx vitest run --pool=forks --maxWorkers=1
      - run: npm run build
