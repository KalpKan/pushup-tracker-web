name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests: counter, form rules, hints, classifier v2 vs Keras, and the hand-labelled corpus gate
      # (tests/corpus.test.ts, both the Python and the browser-recorded landmark traces; a miss fails).
      - run: npx vitest run --pool=forks --maxWorkers=1
      - run: npm run build
